name: Deploy Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - scripts/deploy-firestore-rules.mjs
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report missing deployment credential
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo "::warning::Firestore rules were not deployed because FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
          echo "Add a valid service-account JSON as a repository secret, then run this workflow again."

      - name: Validate and deploy Firestore rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: node scripts/deploy-firestore-rules.mjs
