name: Deploy Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - scripts/deploy-firestore-rules.mjs
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment configuration
        shell: bash
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          }
      - name: Validate and deploy Firestore rules
        run: node scripts/deploy-firestore-rules.mjs
