name: Audit Firestore events

on:
  push:
    branches:
      - main
    paths:
      - scripts/audit-firestore-events.mjs
      - .github/workflows/audit-firestore-events.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-events-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only event inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ne-adunam
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      AUDIT_OUTPUT: firestore-event-audit.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require audit credential
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Run read-only Firestore audit
        shell: bash
        run: |
          FIRESTORE_ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/audit-firestore-events.mjs

      - name: Upload audit report
        if: ${{ always() && hashFiles('firestore-event-audit.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: firestore-event-audit
          path: firestore-event-audit.json
          if-no-files-found: error
          retention-days: 7
